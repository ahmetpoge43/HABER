<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Piyasa Haber Akışı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #191919; /* Notion Dark Mode Arka Planı */
      overflow: hidden;
    }
    .tradingview-widget-container {
      width: 100%;
      height: 100vh;
    }
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<!-- TradingView Haber Akışı Widget'ı -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
  {
    "feedMode": "all_symbols",
    "colorTheme": "dark",
    "isTransparent": true,
    "displayMode": "regular",
    "width": "100%",
    "height": "100%",
    "locale": "tr"
  }
  </script>
</div>

</body>
</html>
