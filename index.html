<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Son 1 Saatlik Önemli Haberler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #191919; /* Notion Dark Mode Arka Planı */
      padding: 8px;
      height: 100vh;
      overflow: hidden;
    }
    .tradingview-widget-container {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- TradingView Son Haberler Widget -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
  {
    "feedMode": "all_symbols",
    "isTransparent": true,
    "displayMode": "regular",
    "width": "100%",
    "height": "100%",
    "colorTheme": "dark",
    "locale": "tr",
    "feedType": "most_recent"
  }
  </script>
</div>

</body>
</html>
